<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediFusion – Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #eef2f7;
  --white: #ffffff;
  --primary: #0057B8;
  --primary-light: #e8f0fb;
  --primary-hover: #0047a0;
  --text: #1a2332;
  --muted: #64748b;
  --border: #d4dce8;
  --danger: #dc2626;
  --danger-bg: #fef2f2;
  --success: #16a34a;
  --success-bg: #f0fdf4;
}

body {
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  position: relative;
}

/* subtle background pattern */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(0,87,184,0.07) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(0,180,216,0.06) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ── TOP HEADER BAR ── */
.site-header {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 32px;
}
.site-logo {
  width: 44px; height: 44px;
  background: var(--primary);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  box-shadow: 0 4px 14px rgba(0,87,184,0.25);
}
.site-name { font-size: 22px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
.site-tagline { font-size: 12px; color: var(--muted); }

/* ── CARD ── */
.login-card {
  position: relative; z-index: 1;
  width: 100%;
  max-width: 440px;
  background: var(--white);
  border-radius: 20px;
  border: 1px solid var(--border);
  box-shadow: 0 8px 40px rgba(0,87,184,0.10), 0 2px 8px rgba(0,0,0,0.04);
  padding: 40px 40px 36px;
}

.card-heading {
  text-align: center;
  margin-bottom: 30px;
}
.card-heading h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 5px;
  letter-spacing: -0.4px;
}
.card-heading p {
  font-size: 13px;
  color: var(--muted);
}

/* ── ROLE SELECTOR ── */
.role-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 26px;
  background: var(--bg);
  padding: 5px;
  border-radius: 14px;
  border: 1px solid var(--border);
}
.role-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 11px 6px;
  border-radius: 10px;
  border: 2px solid transparent;
  background: transparent;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: all 0.18s;
  color: var(--muted);
}
.role-btn:hover {
  background: var(--white);
  color: var(--text);
}
.role-btn.active {
  background: var(--white);
  border-color: var(--primary);
  color: var(--primary);
  box-shadow: 0 2px 8px rgba(0,87,184,0.12);
}
.role-btn .r-icon { font-size: 22px; line-height: 1; }
.role-btn .r-label { font-size: 11px; font-weight: 700; letter-spacing: 0.2px; }

/* ── FORM ── */
.form-group { margin-bottom: 18px; }
.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 7px;
}
.input-wrap { position: relative; }
.input-prefix {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 44px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  color: var(--muted);
  border-right: 1px solid var(--border);
  pointer-events: none;
}
.form-input {
  width: 100%;
  padding: 13px 16px 13px 52px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 11px;
  color: var(--text);
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  transition: all 0.2s;
}
.form-input:focus {
  outline: none;
  border-color: var(--primary);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(0,87,184,0.09);
}
.form-input::placeholder { color: #b0bec5; font-weight: 400; }

/* ── BUTTON ── */
.btn-login {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  border: none;
  border-radius: 11px;
  color: white;
  font-size: 15px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  letter-spacing: 0.2px;
  transition: all 0.2s;
  margin-top: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-login:hover {
  background: var(--primary-hover);
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(0,87,184,0.28);
}
.btn-login:disabled {
  opacity: 0.65;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* ── ALERTS ── */
.alert {
  display: none;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 16px;
  line-height: 1.4;
}
.alert.error  { background: var(--danger-bg);  border: 1px solid #fca5a5; color: var(--danger); }
.alert.success{ background: var(--success-bg); border: 1px solid #86efac; color: var(--success); }
.alert-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }

/* ── FOOTER LINK ── */
.card-footer {
  margin-top: 22px;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
}
.card-footer a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
}
.card-footer a:hover { text-decoration: underline; }

/* ── DIVIDER ── */
.divider {
  display: flex; align-items: center; gap: 10px;
  margin: 20px 0 18px;
}
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.divider span { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* ── SPINNER ── */
.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.35);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── FOOTER TEXT ── */
.page-footer {
  position: relative; z-index: 1;
  margin-top: 24px;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}

@media (max-width: 480px) {
  .login-card { padding: 30px 24px 28px; }
  .card-heading h1 { font-size: 20px; }
}
</style>
</head>
<body>

<!-- Site Header -->
<div class="site-header">
  <div class="site-logo">🏥</div>
  <div>
    <div class="site-name">MediFusion</div>
    <div class="site-tagline">AI-Powered Healthcare Platform</div>
  </div>
</div>

<!-- Login Card -->
<div class="login-card">

  <div class="card-heading">
    <h1>Sign In to Your Portal</h1>
    <p>Select your role and enter your credentials</p>
  </div>

  <!-- Role Selector -->
  <div class="role-selector">
    <button class="role-btn active" onclick="selectRole('patient', this)" type="button">
      <span class="r-icon">🧑‍🦽</span>
      <span class="r-label">Patient</span>
    </button>
    <button class="role-btn" onclick="selectRole('doctor', this)" type="button">
      <span class="r-icon">👨‍⚕️</span>
      <span class="r-label">Doctor</span>
    </button>
    <button class="role-btn" onclick="selectRole('lab', this)" type="button">
      <span class="r-icon">🔬</span>
      <span class="r-label">Lab Tech</span>
    </button>
  </div>

  <form id="loginForm" onsubmit="loginUser(event)">
    <input type="hidden" id="role" value="patient">

    <!-- Alerts -->
    <div id="loginError" class="alert error">
      <span class="alert-icon">⚠️</span>
      <span id="loginErrorText"></span>
    </div>
    <div id="loginSuccess" class="alert success">
      <span class="alert-icon">✅</span>
      <span id="loginSuccessText"></span>
    </div>

    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <div class="input-wrap">
        <span class="input-prefix">👤</span>
        <input id="username" type="text" class="form-input"
          placeholder="Enter your username" required autocomplete="username">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <div class="input-wrap">
        <span class="input-prefix">🔑</span>
        <input id="password" type="password" class="form-input"
          placeholder="Enter your password" required autocomplete="current-password">
      </div>
    </div>

    <button id="loginBtn" class="btn-login" type="submit">
      Sign In to Dashboard
    </button>
  </form>

  <div class="divider"><span>New to MediFusion?</span></div>
  <div class="card-footer">
    Don't have an account? <a href="signup.html">Create one here →</a>
  </div>

</div>

<div class="page-footer">© 2024 MediFusion Healthcare · Secure & Private</div>

<script src="api.js"></script>
<script>
function selectRole(role, el) {
  document.getElementById('role').value = role;
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}
</script>
<script src="login.js"></script>
</body>
</html>
